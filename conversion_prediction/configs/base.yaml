seed: 42

paths:
  # 相对路径以 conversion_prediction/ 为基准。
  raw_data: data/raw/view_data.parquet
  processed_dir: data/processed
  artifacts_dir: artifacts

data:
  min_seq_len: 2
  max_seq_len: 50
  row_limit: null
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
  hash_buckets:
    event: 4096
    page: 2048
    category: 1024
    poi: 65536

model:
  hidden_dim: 64
  num_layers: 2
  num_heads: 4
  ff_dim: 256  # hidden_dim*4
  dropout: 0.10

training:
  # 小模型 + 短序列（最长 50），batch 256 会让 GPU 大量空转等数据；
  # 提到 2048 让每个 batch 填满计算单元，单 epoch 批次数从约 2000 降到约 250。
  batch_size: 2048
  epochs: 15
  # batch 扩大 8 倍，学习率按比例温和上调（AdamW 对 lr 不敏感，可再微调）。
  learning_rate: 0.003
  weight_decay: 0.0001
  early_stopping_patience: 3
  # 多进程加载数据，避免 GPU 空等下一批；Windows 本地跑如报错可改回 0。
  num_workers: 4
  sample_limit: null
  device: auto
