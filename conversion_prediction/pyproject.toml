[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-life-conversion"
version = "0.1.0"
description = "Session-based local-life conversion prediction with GRU and Transformer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.0",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.scripts]
conversion-prediction = "conversion_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
